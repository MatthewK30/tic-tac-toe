<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background: #0a0a1a;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
height: 100vh;
font-family: 'Segoe UI', system-ui, sans-serif;
color: #e0e0ff;
overflow: hidden;
}
h1 {
font-size: 2.5rem;
margin-bottom: 0.5rem;
letter-spacing: 0.15em;
text-transform: uppercase;
background: linear-gradient(135deg, #00d4ff, #7b2fff);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
text-shadow: none;
}
#status {
font-size: 1.3rem;
margin-bottom: 1rem;
min-height: 2rem;
letter-spacing: 0.05em;
}
#game-container {
position: relative;
width: 420px;
height: 420px;
}
canvas {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
}
#bg-canvas { z-index: 0; }
#game-canvas { z-index: 1; cursor: pointer; }
#restart-btn {
margin-top: 1.5rem;
padding: 0.7rem 2.5rem;
font-size: 1rem;
font-family: inherit;
letter-spacing: 0.1em;
text-transform: uppercase;
border: none;
border-radius: 8px;
background: linear-gradient(135deg, #00d4ff, #7b2fff);
color: #fff;
cursor: pointer;
transition: transform 0.15s, box-shadow 0.15s;
}
#restart-btn:hover {
transform: scale(1.05);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
    }
    #timer-container {
      width: 420px;
      height: 8px;
      background: #1a1a2e;
      border-radius: 4px;
      margin-bottom: 1rem;
      overflow: hidden;
    }
    #timer-bar {
      height: 100%;
      width: 100%;
      border-radius: 4px;
      background: hsl(120, 100%, 50%);
      transition: background-color 0.1s;
    }
    .winner-text {
      animation: winPulse 0.6s ease-in-out infinite alternate;
    }
    @keyframes winPulse {
      from { text-shadow: 0 0 5px currentColor; transform: scale(1); }
      to   { text-shadow: 0 0 20px currentColor, 0 0 40px currentColor; transform: scale(1.08); }
    }
    </style>
</head>
<body>
<h1>Tic-Tac-Toe</h1>
<div id="status">X's turn</div>
<div id="timer-container"><div id="timer-bar"></div></div>
<div id="game-container">
<canvas id="bg-canvas"></canvas>
<canvas id="game-canvas"></canvas>
</div>
<button id="restart-btn">Restart</button>

<script>
const SIZE = 420;
const CELL = SIZE / 3;
const LINES = [
[0,1,2],[3,4,5],[6,7,8],
[0,3,6],[1,4,7],[2,5,8],
[0,4,8],[2,4,6]
];

let board = Array(9).fill(null);
let currentPlayer = 'X';
let gameOver = false;
let winner = null;
let winLine = null;
let moveTime = Array(9).fill(0);
let now = 0;
let hoverCell = -1;
const TURN_TIME = 5;
let turnStart = 0;
let lastFrame = 0;

function cellCenter(i) {
return { x: (i % 3) * CELL + CELL / 2, y: Math.floor(i / 3) * CELL + CELL / 2 };
}

function getWinner() {
for (const line of LINES) {
const [a,b,c] = line;
if (board[a] && board[a] === board[b] && board[a] === board[c])
return { player: board[a], line };
}
return null;
}

function handleClick(e) {
if (gameOver) return;
const rect = gameCanvas.getBoundingClientRect();
const scaleX = gameCanvas.width / rect.width;
const scaleY = gameCanvas.height / rect.height;
const mx = (e.clientX - rect.left) * scaleX;
const my = (e.clientY - rect.top) * scaleY;
const col = Math.floor(mx / CELL);
const row = Math.floor(my / CELL);
if (col < 0 || col > 2 || row < 0 || row > 2) return;
const i = row * 3 + col;
if (board[i]) return;
board[i] = currentPlayer;
moveTime[i] = now;
const result = getWinner();
if (result) {
gameOver = true;
winner = result.player;
winLine = result.line;
    statusEl.textContent = winner + ' wins!';
    statusEl.classList.add('winner-text');
    statusEl.style.color = winner === 'X' ? '#00d9ff' : '#7b2fff';
  } else if (board.every(c => c)) {
    gameOver = true;
    statusEl.textContent = "It's a draw!";
    statusEl.classList.add('winner-text');
    statusEl.style.color = '#ffd966';
  } else {
    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
    statusEl.textContent = currentPlayer + "'s turn";
    turnStart = now;
}
}

function handleMove(e) {
const rect = gameCanvas.getBoundingClientRect();
const scaleX = gameCanvas.width / rect.width;
const scaleY = gameCanvas.height / rect.height;
const mx = (e.clientX - rect.left) * scaleX;
const my = (e.clientY - rect.top) * scaleY;
const col = Math.floor(mx / CELL);
const row = Math.floor(my / CELL);
if (col >= 0 && col <= 2 && row >= 0 && row <= 2) {
hoverCell = row * 3 + col;
} else {
hoverCell = -1;
}
}

function restart() {
board = Array(9).fill(null);
currentPlayer = 'X';
gameOver = false;
winner = null;
winLine = null;
moveTime = Array(9).fill(0);
statusEl.textContent = "X's turn";
statusEl.classList.remove('winner-text');
statusEl.style.color = '';
timerBar.style.width = '100%';
timerBar.style.backgroundColor = 'hsl(120, 100%, 50%)';
turnStart = now;
}

const statusEl = document.getElementById('status');
const timerBar = document.getElementById('timer-bar');
const restartBtn = document.getElementById('restart-btn');
restartBtn.addEventListener('click', restart);

// === BACKGROUND WebGL ===
const bgCanvas = document.getElementById('bg-canvas');
const bgGl = bgCanvas.getContext('webgl', { alpha: false, antialias: true });
bgCanvas.width = SIZE * devicePixelRatio;
bgCanvas.height = SIZE * devicePixelRatio;

const bgVS = `
attribute vec2 a_pos;
void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }
`;

const bgFS = `
precision mediump float;
uniform float u_time;
uniform vec2 u_res;

float hash(vec2 p) {
return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float noise(vec2 p) {
vec2 i = floor(p);
vec2 f = fract(p);
f = f * f * (3.0 - 2.0 * f);
float a = hash(i);
float b = hash(i + vec2(1.0, 0.0));
float c = hash(i + vec2(0.0, 1.0));
float d = hash(i + vec2(1.0, 1.0));
return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

void main() {
vec2 uv = gl_FragCoord.xy / u_res;
float t = u_time * 0.3;

float n = noise(uv * 3.0 + t);
float n2 = noise(uv * 5.0 - t * 0.7);

vec3 c1 = vec3(0.04, 0.04, 0.12);
vec3 c2 = vec3(0.0, 0.15, 0.3);
vec3 c3 = vec3(0.2, 0.05, 0.4);

vec3 col = mix(c1, c2, n * 0.6);
col = mix(col, c3, n2 * 0.3);

// grid lines glow
vec2 cell = fract(uv * 3.0);
float gridX = smoothstep(0.0, 0.04, cell.x) * smoothstep(0.0, 0.04, 1.0 - cell.x);
float gridY = smoothstep(0.0, 0.04, cell.y) * smoothstep(0.0, 0.04, 1.0 - cell.y);
float grid = 1.0 - gridX * gridY;
col += vec3(0.1, 0.4, 0.8) * grid * (0.15 + 0.05 * sin(u_time * 2.0 + uv.x * 10.0));

gl_FragColor = vec4(col, 1.0);
}
`;

function createShader(gl, type, src) {
const s = gl.createShader(type);
gl.shaderSource(s, src);
gl.compileShader(s);
if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
console.error(gl.getShaderInfoLog(s));
gl.deleteShader(s);
return null;
}
return s;
}

function createProgram(gl, vs, fs) {
const p = gl.createProgram();
gl.attachShader(p, vs);
gl.attachShader(p, fs);
gl.linkProgram(p);
if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
console.error(gl.getProgramInfoLog(p));
return null;
}
return p;
}

const bgProg = createProgram(bgGl,
createShader(bgGl, bgGl.VERTEX_SHADER, bgVS),
createShader(bgGl, bgGl.FRAGMENT_SHADER, bgFS)
);

const bgPosLoc = bgGl.getAttribLocation(bgProg, 'a_pos');
const bgTimeLoc = bgGl.getUniformLocation(bgProg, 'u_time');
const bgResLoc = bgGl.getUniformLocation(bgProg, 'u_res');

const bgBuf = bgGl.createBuffer();
bgGl.bindBuffer(bgGl.ARRAY_BUFFER, bgBuf);
bgGl.bufferData(bgGl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), bgGl.STATIC_DRAW);

// === GAME WebGL ===
const gameCanvas = document.getElementById('game-canvas');
const gl = gameCanvas.getContext('webgl', { alpha: true, antialias: true });
gameCanvas.width = SIZE * devicePixelRatio;
gameCanvas.height = SIZE * devicePixelRatio;

gameCanvas.addEventListener('click', handleClick);
gameCanvas.addEventListener('mousemove', handleMove);

const gameVS = `
attribute vec2 a_pos;
uniform vec2 u_offset;
uniform float u_scale;
uniform float u_rot;
void main() {
float c = cos(u_rot);
float s = sin(u_rot);
vec2 p = mat2(c, s, -s, c) * a_pos * u_scale + u_offset;
gl_Position = vec4(p, 0.0, 1.0);
}
`;

const xFS = `
precision mediump float;
uniform float u_glow;
uniform float u_time;
void main() {
float pulse = 0.7 + 0.3 * sin(u_time * 3.0);
gl_FragColor = vec4(0.0, 0.85 * u_glow, 1.0 * u_glow, (0.9 + 0.1 * pulse) * u_glow);
}
`;

const oFS = `
precision mediump float;
uniform float u_glow;
uniform float u_time;
void main() {
float pulse = 0.7 + 0.3 * sin(u_time * 3.0 + 1.0);
gl_FragColor = vec4(0.45 * u_glow, 0.15 * u_glow, 1.0 * u_glow, (0.9 + 0.1 * pulse) * u_glow);
}
`;

const lineFS = `
precision mediump float;
uniform float u_progress;
uniform float u_time;
void main() {
float pulse = 0.8 + 0.2 * sin(u_time * 4.0);
gl_FragColor = vec4(1.0, 1.0, 1.0, u_progress * pulse);
}
`;

const hoverFS = `
precision mediump float;
uniform float u_alpha;
void main() {
gl_FragColor = vec4(0.3, 0.6, 1.0, u_alpha * 0.2);
}
`;

function makeProgram(gl, vsSrc, fsSrc) {
return createProgram(gl,
createShader(gl, gl.VERTEX_SHADER, vsSrc),
createShader(gl, gl.FRAGMENT_SHADER, fsSrc)
);
}

const xProg = makeProgram(gl, gameVS, xFS);
const oProg = makeProgram(gl, gameVS, oFS);
const lineProg = makeProgram(gl, gameVS, lineFS);
const hoverProg = makeProgram(gl, gameVS, hoverFS);

function getUniforms(gl, prog, names) {
const u = {};
names.forEach(n => u[n] = gl.getUniformLocation(prog, n));
return u;
}

const xU = getUniforms(gl, xProg, ['u_offset','u_scale','u_rot','u_glow','u_time']);
const oU = getUniforms(gl, oProg, ['u_offset','u_scale','u_rot','u_glow','u_time']);
const lineU = getUniforms(gl, lineProg, ['u_offset','u_scale','u_rot','u_progress','u_time']);
const hoverU = getUniforms(gl, hoverProg, ['u_offset','u_scale','u_rot','u_alpha']);

// X shape: two crossing lines made of thin quads
function buildXGeometry() {
const v = [];
const hw = 0.06, len = 0.35;
// diagonal 1: top-left to bottom-right
v.push(-len,-hw, len,-hw, len,hw, -len,hw);
v.push(len,hw, -len,hw, -len,-hw, len,-hw);
// diagonal 2: top-right to bottom-left  
v.push(-len,hw, len,-hw, len,hw, -len,-hw);
v.push(len,hw, -len,-hw, -len,-hw, -len,hw);
return new Float32Array(v);
}

// O shape: circle outline made of triangles
function buildOGeometry(segs) {
const v = [];
const inner = 0.28, outer = 0.36;
for (let i = 0; i < segs; i++) {
const a1 = (i / segs) * Math.PI * 2;
const a2 = ((i + 1) / segs) * Math.PI * 2;
const c1 = Math.cos(a1), s1 = Math.sin(a1);
const c2 = Math.cos(a2), s2 = Math.sin(a2);
v.push(inner*c1,inner*s1, outer*c1,outer*s1, outer*c2,outer*s2);
v.push(inner*c1,inner*s1, outer*c2,outer*s2, inner*c2,inner*s2);
}
return new Float32Array(v);
}

// Quad for hover highlight and win line
const quadVerts = new Float32Array([-0.5,-0.5, 0.5,-0.5, 0.5,0.5, -0.5,0.5]);

const xVerts = buildXGeometry();
const oVerts = buildOGeometry(48);

const xBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, xBuf);
gl.bufferData(gl.ARRAY_BUFFER, xVerts, gl.STATIC_DRAW);

const oBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, oBuf);
gl.bufferData(gl.ARRAY_BUFFER, oVerts, gl.STATIC_DRAW);

const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, quadVerts, gl.STATIC_DRAW);

function toClip(px, py) {
return [(px / SIZE) * 2 - 1, 1 - (py / SIZE) * 2];
}

function drawShape(prog, uniforms, buf, vertCount, px, py, scale, rot, extra) {
gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
const loc = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const [cx, cy] = toClip(px, py);
const s = scale * 2 / (SIZE / CELL);
gl.uniform2f(uniforms.u_offset, cx, cy);
gl.uniform1f(uniforms.u_scale, s);
gl.uniform1f(uniforms.u_rot, rot);

for (const [k, v] of Object.entries(extra)) {
gl.uniform1f(uniforms[k], v);
}

gl.drawArrays(gl.TRIANGLES, 0, vertCount);
}

gl.enable(gl.BLEND);
gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

let startTime = performance.now() / 1000;

function render() {
now = performance.now() / 1000 - startTime;
const dt = lastFrame === 0 ? 0 : Math.min(now - lastFrame, 0.1);
lastFrame = now;
const t = now;

// Timer
if (turnStart === 0) turnStart = now;
if (!gameOver) {
  const elapsed = now - turnStart;
  const fraction = Math.max(0, 1 - elapsed / TURN_TIME);
  timerBar.style.width = fraction * 100 + '%';
  timerBar.style.backgroundColor = 'hsl(' + (fraction * 120) + ', 100%, 50%)';
  if (elapsed >= TURN_TIME) {
    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
    statusEl.textContent = currentPlayer + "'s turn";
    turnStart = now;
  }
} else {
  timerBar.style.width = '100%';
  timerBar.style.backgroundColor = '#333';
}

// BG
bgGl.viewport(0, 0, bgCanvas.width, bgCanvas.height);
bgGl.useProgram(bgProg);
bgGl.bindBuffer(bgGl.ARRAY_BUFFER, bgBuf);
bgGl.enableVertexAttribArray(bgPosLoc);
bgGl.vertexAttribPointer(bgPosLoc, 2, bgGl.FLOAT, false, 0, 0);
bgGl.uniform1f(bgTimeLoc, t);
bgGl.uniform2f(bgResLoc, bgCanvas.width, bgCanvas.height);
bgGl.drawArrays(bgGl.TRIANGLE_STRIP, 0, 4);

// Game
gl.viewport(0, 0, gameCanvas.width, gameCanvas.height);
gl.clearColor(0, 0, 0, 0);
gl.clear(gl.COLOR_BUFFER_BIT);

// Hover
if (hoverCell >= 0 && !board[hoverCell] && !gameOver) {
const hc = cellCenter(hoverCell);
drawShape(hoverProg, hoverU, quadBuf, 4, hc.x, hc.y, CELL * 0.95, 0, { u_alpha: 1.0 });
}

// Pieces
for (let i = 0; i < 9; i++) {
if (!board[i]) continue;
const c = cellCenter(i);
const age = Math.min((t - moveTime[i]) * 4, 1);
const scale = 0.3 + 0.7 * easeOutBack(age);
const rot = (1 - age) * Math.PI * 0.5;
const prog = age;

if (board[i] === 'X') {
drawShape(xProg, xU, xBuf, 8, c.x, c.y, scale, rot,
{ u_glow: prog, u_time: t });
} else {
drawShape(oProg, oU, oBuf, 48 * 3, c.x, c.y, scale, rot,
{ u_glow: prog, u_time: t });
}
}

// Win line
if (winLine) {
const [a, b] = winLine;
const ca = cellCenter(a);
const cb = cellCenter(b);
const dx = cb.x - ca.x;
const dy = cb.y - ca.y;
const angle = Math.atan2(-(dy), dx);
const len = Math.sqrt(dx * dx + dy * dy) + CELL * 0.15;
const mx = (ca.x + cb.x) / 2;
const my = (ca.y + cb.y) / 2;
const prog = Math.min(t * 2, 1);
drawShape(lineProg, lineU, quadBuf, 4, mx, my, len, angle,
{ u_progress: prog, u_time: t });
}

requestAnimationFrame(render);
}

function easeOutBack(x) {
const c1 = 1.70158;
const c3 = c1 + 1;
return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
}

render();
</script>
</body>
</html>
